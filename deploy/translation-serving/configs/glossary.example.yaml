# =====================================================================
# 术语表示例（复制为 glossary.yaml 使用）
# 字段：
#   src            源术语（必填）
#   tgt            目标术语（必填）
#   domain         领域；general 表示全局生效（可选，默认 general）
#   case_sensitive 是否区分大小写（可选，默认 false）
# =====================================================================

terms:
  - src: "GPU"
    tgt: "图形处理器"
    domain: general
    case_sensitive: true

  - src: "latency"
    tgt: "时延"
    domain: "technical"

  - src: "throughput"
    tgt: "吞吐量"
    domain: "technical"

  - src: "Qwen"
    tgt: "通义千问"
    domain: "general"
    case_sensitive: true
